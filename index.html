<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Northwestern Housing Finder</title>

  <!-- Favicon -->
  <link rel="icon" href="./favicon.ico" type="image/x-icon">
  <!-- Optional PNG fallback -->
  <link rel="icon" href="./favicon.png" type="image/png">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- Main Styles -->
  <link rel="stylesheet" href="./style.css" />
</head>

<body>
  <div class="app">

    <!-- Map Area -->
    <div class="mapWrap">
      <div id="map"></div>

      <!-- Floating Title -->
      <div class="topbar">
        <div class="topbar-inner">
          <div class="title">Northwestern Housing Finder</div>
          <div class="subtitle">Click a marker to explore apartments</div>
        </div>
      </div>
    </div>

    <!-- Side Panel -->
    <aside id="panel" class="panel hidden" aria-hidden="true">
      <div class="panel-header">
        <div>
          <div id="panelTitle" class="panel-title">Apartment</div>
          <div id="panelAddress" class="panel-address"></div>
        </div>
        <button id="panelClose" class="panel-close" aria-label="Close panel">×</button>
      </div>

      <div id="panelBody" class="panel-body"></div>
    </aside>

  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Main Script -->
  <script type="module" src="script.js"></script>

  <!-- Sticky Notes Modal -->
<div id="commentModal" class="modal hidden">
  <div class="modal-content">
    <h3>Notes</h3>

    <div id="notesContainer"></div>

    <textarea id="newNoteText" placeholder="Leave a note..."></textarea>
    <button id="addNoteBtn">Add Note</button>

    <button id="closeModal">Close</button>
  </div>
</div>


<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    query,
    where,
    orderBy
  } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyA7f1UN1easzEer490PYRigygmLUE_xGMw"",
    authDomain: "nu-housing-comments.firebaseapp.com",
    projectId: "nu-housing-comments",
    storageBucket: "nu-housing-comments.firebasestorage.app",
    messagingSenderId: "791252409254",
    appId: "1:791252409254:web:fad82c4d93099cc4700d67"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  let currentApartmentId = null;

  window.openNotes = async function(apartmentId) {
    currentApartmentId = apartmentId;

    document.getElementById("commentModal").classList.remove("hidden");

    const notesContainer = document.getElementById("notesContainer");
    notesContainer.innerHTML = "";

    const q = query(
      collection(db, "comments"),
      where("apartmentId", "==", apartmentId),
      orderBy("createdAt", "desc")
    );

    const snapshot = await getDocs(q);

    snapshot.forEach(doc => {
      const data = doc.data();

      const div = document.createElement("div");
      div.className = "sticky-note";
      div.innerText = data.text;

      notesContainer.appendChild(div);
    });
  };

  document.getElementById("addNoteBtn").onclick = async () => {
    const textArea = document.getElementById("newNoteText");
    const text = textArea.value.trim();

    if (!text) return;

    await addDoc(collection(db, "comments"), {
      apartmentId: currentApartmentId,
      text: text,
      createdAt: Date.now()
    });

    textArea.value = "";

    openNotes(currentApartmentId);
  };

  document.getElementById("closeModal").onclick = () => {
    document.getElementById("commentModal").classList.add("hidden");
  };
</script>
  
</body>
</html>
