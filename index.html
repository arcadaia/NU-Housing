<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Northwestern Housing Finder</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <link rel="stylesheet" href="./style.css" />
</head>

<body>
  <div class="app">

    <div class="mapWrap">
      <div id="map"></div>

      <div class="topbar">
        <div class="topbar-inner">
          <div class="title">Northwestern Housing Finder</div>
          <div class="subtitle">Click a marker to explore apartments</div>
        </div>
      </div>
    </div>

    <aside id="panel" class="panel hidden" aria-hidden="true">
      <div class="panel-header">
        <div>
          <div id="panelTitle" class="panel-title">Apartment</div>
          <div id="panelAddress" class="panel-address"></div>
        </div>
        <button id="panelClose" class="panel-close">×</button>
      </div>

      <div id="panelBody" class="panel-body"></div>
    </aside>

  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="./script.js"></script>
</body>
</html>
