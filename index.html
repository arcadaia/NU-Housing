<body>
  <div id="map"></div>

  <!-- Centered title -->
  <div class="topbar">
    <div class="topbar-inner">
      <div class="title">Evanston apartment map</div>
      <div class="subtitle">Click a marker to open details</div>
    </div>
  </div>

  <!-- Modal backdrop -->
  <div id="modalBackdrop" class="modal-backdrop hidden" aria-hidden="true"></div>

  <!-- Floating modal -->
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-header">
      <div>
        <div id="modalTitle" class="modal-title">Apartment</div>
        <div id="modalAddress" class="modal-address"></div>
      </div>
      <button id="modalClose" class="modal-close" aria-label="Close">×</button>
    </div>

    <div id="modalBody" class="modal-body"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="./script.js"></script>
</body>
