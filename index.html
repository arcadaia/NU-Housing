<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Northwestern Housing Finder</title>

  <link rel="icon" href="favicon.ico" type="image/png">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="app">
    <div class="mapWrap">
      <div id="map"></div>

      <div class="topbar">
        <div class="topbar-inner">
          <div>
            <div class="title">Northwestern Housing Finder</div>
            <div class="subtitle">Click a marker to explore apartments</div>
          </div>

          <div class="topbar-controls">
            <select id="sortSelect">
              <option value="distance">Distance</option>
              <option value="cheapest">Cheapest</option>
            </select>

            <button id="compareToggleBtn">Compare: Off</button>
            <button id="compareOpenBtn" disabled>Compare (0/2)</button>
            <button id="compareClearBtn" disabled>Clear</button>
          </div>
        </div>
      </div>
    </div>

    <aside id="panel" class="panel hidden">
      <div class="panel-header">
        <div>
          <div id="panelTitle" class="panel-title"></div>
          <div id="panelAddress" class="panel-address"></div>
        </div>
        <button id="panelClose">×</button>
      </div>
      <div id="panelBody" class="panel-body"></div>
    </aside>
  </div>

  <div id="compareModal" class="compare-modal hidden">
    <div class="compare-backdrop" id="compareBackdrop"></div>
    <div class="compare-card">
      <div class="compare-header">
        Compare Apartments
        <button id="compareCloseBtn">×</button>
      </div>
      <div class="compare-body">
        <div id="cmpA"></div>
        <div id="cmpB"></div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="script.js"></script>
</body>
</html>
