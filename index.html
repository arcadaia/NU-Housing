<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Evanston Apartment Map</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="./style.css" />
</head>

<body>
  <div id="map"></div>

  <!-- Centered title -->
  <div class="topbar">
    <div class="topbar-inner">
      <div class="title">Evanston apartment map</div>
      <div class="subtitle">Click a marker to open details</div>
    </div>
  </div>

  <!-- Dim backdrop when panel open -->
  <div id="backdrop" class="backdrop hidden"></div>

  <!-- Right-side window panel -->
  <aside id="panel" class="panel hidden" aria-hidden="true">
    <div class="panel-header">
      <div>
        <div id="panelTitle" class="panel-title">Apartment</div>
        <div id="panelAddress" class="panel-address"></div>
      </div>
      <button id="panelClose" class="panel-close" aria-label="Close">×</button>
    </div>

    <div id="panelBody" class="panel-body"></div>
  </aside>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="./script.js"></script>
</body>
</html>
