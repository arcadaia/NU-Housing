<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Northwestern Housing Finder</title>

  <!-- Favicon -->
  <link rel="icon" href="./favicon.ico" type="image/x-icon">
  <link rel="icon" href="./assets/favicon.png" type="image/png">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="./style.css?v=7" />
</head>

<body>
  <div class="app">

    <div class="mapWrap">
      <div id="map"></div>

      <div class="topbar" id="topbar">
        <div class="topbar-inner">
          <div class="topbar-title">
            <div class="title">Northwestern Housing Finder</div>
            <div class="subtitle">Click a marker to explore apartments</div>
          </div>

          <label class="control">
            <span class="control-label">Sort</span>
            <select id="sortSelect" class="control-select">
              <option value="distance">Distance</option>
              <option value="cheapest">Cheapest</option>
            </select>
          </label>
        </div>
      </div>

      <div class="compare-box">
        <button id="compareToggleBtn" class="control-btn" type="button">
          Compare mode: Off
        </button>

        <button id="compareOpenBtn" class="control-btn primary" type="button" disabled>
          Compare (0/2)
        </button>

        <button id="compareClearBtn" class="control-btn" type="button" disabled>
          Clear
        </button>
      </div>

    </div> <!-- end mapWrap -->

    <aside id="panel" class="panel hidden" aria-hidden="true">
      <div class="panel-header">
        <div>
          <div id="panelTitle" class="panel-title">Apartment</div>
          <div id="panelAddress" class="panel-address"></div>
        </div>
        <button id="panelClose" class="panel-close" aria-label="Close panel" type="button">×</button>
      </div>

      <div id="panelBody" class="panel-body"></div>
    </aside>

  </div> <!-- end app -->

  <!-- Compare modal -->
  <div id="compareModal" class="compare-modal hidden" aria-hidden="true">
    <div class="compare-backdrop" id="compareBackdrop"></div>

    <div class="compare-card" role="dialog" aria-modal="true" aria-label="Compare apartments">
      <div class="compare-header">
        <div class="compare-title">Compare apartments</div>
        <button id="compareCloseBtn" class="compare-close" type="button" aria-label="Close compare">×</button>
      </div>

      <div class="compare-body">
        <div class="compare-col">
          <div class="compare-col-title" id="cmpA_name">—</div>
          <div class="compare-col-sub" id="cmpA_addr">—</div>

          <div class="compare-grid">
            <div class="compare-row">
              <div class="compare-label">Distance</div>
              <div class="compare-value" id="cmpA_dist">—</div>
            </div>
            <div class="compare-row">
              <div class="compare-label">Rank</div>
              <div class="compare-value" id="cmpA_rank">—</div>
            </div>
            <div class="compare-row">
              <div class="compare-label">1BR</div>
              <div class="compare-value" id="cmpA_price">—</div>
            </div>
            <div class="compare-row">
              <div class="compare-label">AC</div>
              <div class="compare-value" id="cmpA_ac">—</div>
            </div>
            <div class="compare-row">
              <div class="compare-label">Parking</div>
              <div class="compare-value" id="cmpA_parking">—</div>
            </div>
          </div>

          <a id="cmpA_link" class="primary-btn compare-link" href="#" target="_blank" rel="noopener noreferrer">
            View property website
          </a>
        </div>

        <div class="compare-divider"></div>

        <div class="compare-col">
          <div class="compare-col-title" id="cmpB_name">—</div>
          <div class="compare-col-sub" id="cmpB_addr">—</div>

          <div class="compare-grid">
            <div class="compare-row">
              <div class="compare-label">Distance</div>
              <div class="compare-value" id="cmpB_dist">—</div>
            </div>
            <div class="compare-row">
              <div class="compare-label">Rank</div>
              <div class="compare-value" id="cmpB_rank">—</div>
            </div>
            <div class="compare-row">
              <div class="compare-label">1BR</div>
              <div class="compare-value" id="cmpB_price">—</div>
            </div>
            <div class="compare-row">
              <div class="compare-label">AC</div>
              <div class="compare-value" id="cmpB_ac">—</div>
            </div>
            <div class="compare-row">
              <div class="compare-label">Parking</div>
              <div class="compare-value" id="cmpB_parking">—</div>
            </div>
          </div>

          <a id="cmpB_link" class="primary-btn compare-link" href="#" target="_blank" rel="noopener noreferrer">
            View property website
          </a>
        </div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Firebase compat -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <script src="./script.js?v=7"></script>
</body>
</html>
